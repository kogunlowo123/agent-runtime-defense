apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-runtime-defense-app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kogunlowo123/agent-runtime-defense.git
    targetRevision: main
    path: deploy/argocd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

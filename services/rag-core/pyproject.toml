[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sentence-transformers>=3.0",
    "langgraph>=0.2",
    "litellm>=1.40",
    "psycopg2-binary>=2.9",
    "azure-search-documents>=11.4",
    "azure-core>=1.30",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "structlog>=24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]

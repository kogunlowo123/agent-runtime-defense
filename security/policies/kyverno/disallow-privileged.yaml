apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Privileged containers are disabled for all agent-runtime-defense workloads.
      Agents must not run with host namespaces or elevated capabilities.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - agent-runtime-defense
                - agent-runtime-defense-staging
      validate:
        message: "Privileged containers are not allowed."
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(privileged): "false"

    - name: disallow-host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - agent-runtime-defense
                - agent-runtime-defense-staging
      validate:
        message: "Host namespaces (PID, IPC, Network) are not allowed."
        pattern:
          spec:
            =(hostPID): "false"
            =(hostIPC): "false"
            =(hostNetwork): "false"

    - name: require-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - agent-runtime-defense
      validate:
        message: "Containers must not run as root (UID 0)."
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true

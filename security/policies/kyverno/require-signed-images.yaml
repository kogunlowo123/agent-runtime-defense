apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
  annotations:
    policies.kyverno.io/title: Require Signed Container Images
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      All container images deployed to agent-runtime-defense namespaces
      must be signed with Cosign and verified against the organization
      signing key. Prevents supply chain attacks via unsigned images.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-image-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - agent-runtime-defense
                - agent-runtime-defense-staging
      verifyImages:
        - imageReferences:
            - "*.azurecr.io/agent-runtime-defense/*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/kogunlowo123/agent-runtime-defense/.github/workflows/*.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: docker
    directory: "/services/api"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: "/services/agent-runtime"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  - package-ecosystem: terraform
    directory: "/infra/envs/azure/dev"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - terraform

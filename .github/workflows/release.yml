name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Agent Runtime Defense ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  build-push-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
      - name: Build and push API image
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          docker build services/api/ -t ${{ secrets.ACR_LOGIN_SERVER }}/agent-runtime-defense/api:$VERSION
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/agent-runtime-defense/api:$VERSION \
            ${{ secrets.ACR_LOGIN_SERVER }}/agent-runtime-defense/api:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/agent-runtime-defense/api:$VERSION
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/agent-runtime-defense/api:latest

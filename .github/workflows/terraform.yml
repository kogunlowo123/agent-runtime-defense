name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, prod]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/
      - name: Validate dev module
        working-directory: infra/envs/azure/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

  plan-dev:
    name: Plan Dev
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
      - name: Terraform Init
        working-directory: infra/envs/azure/dev
        run: terraform init
      - name: Terraform Plan
        working-directory: infra/envs/azure/dev
        run: terraform plan -out=tfplan.bin -input=false -var="db_admin_password=${{ secrets.DB_ADMIN_PASSWORD }}"
      - name: Show plan
        working-directory: infra/envs/azure/dev
        run: terraform show -no-color tfplan.bin

  apply-dev:
    name: Apply Dev
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
      - name: Terraform Init
        working-directory: infra/envs/azure/dev
        run: terraform init
      - name: Terraform Apply
        working-directory: infra/envs/azure/dev
        run: terraform apply -auto-approve -input=false -var="db_admin_password=${{ secrets.DB_ADMIN_PASSWORD }}"

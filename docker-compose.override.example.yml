# Copy to docker-compose.override.yml for local development overrides.
# This file is excluded from git.
version: "3.9"

services:
  api:
    environment:
      - APP_LOG_LEVEL=DEBUG
      - APP_ENV=development
    volumes:
      - ./services/api/src:/app/src
    command: ["uvicorn", "api.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]

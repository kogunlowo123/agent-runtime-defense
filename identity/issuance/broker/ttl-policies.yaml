policies:
  - family: anomaly-detector
    tier: T1
    default_ttl_seconds: 3600      # 1 hour
    max_ttl_seconds: 14400         # 4 hours
    allowed_scopes: [T1]
    require_mfa: false

  - family: behavior-analyst
    tier: T1
    default_ttl_seconds: 3600
    max_ttl_seconds: 14400
    allowed_scopes: [T1]
    require_mfa: false

  - family: threat-responder
    tier: T2
    default_ttl_seconds: 900       # 15 minutes — short-lived for T2
    max_ttl_seconds: 1800          # 30 minutes maximum
    allowed_scopes: [T1, T2]
    require_mfa: true
    approval_required_for: [isolate, revoke]
